<!DOCTYPE html>
<html>
  <head>
     <meta charset="UTF-8">
     <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Witaj w mojej ultra sigma stronie">
    <title>maciej hub</title>
  <link rel="icon" type="image/x-icon" href="/ikon.png">
    <link href="/style2.css" rel="stylesheet" type="text/css" media="all">
    <style>
        body {
            background-color: transparent;
            zoom: 100%;
        }

        .centerenter {
            text-align: center;
        }
    </style>
  </head>
<body>
    <div id="content" class="centerenter">
        <img id="throbber" src="loading.png" width="64">
        <h2><div id="text"></div></h2>
        <button id="OK" class="centerpopupbutton" onclick="hidetext()">Zamknij</button>
        <button id="last" class="centerpopupbutton" onclick="lastversion()">Ostatnia wersja</button>
        <button id="next" class="centerpopupbutton" onclick="nextversion()">Następna wersja</button>
        <button id="help" class="centerpopupbutton" onclick="help_me()">Co znaczą te liczby</button>
        <button id="back" style="display: none;" class="centerpopupbutton" onclick="go_back()">Wróć</button>
    </div>
    <script>
function get(x) {
  return document.getElementById(x);
}
function sleep(ms) {
	return new Promise(resolve => setTimeout(resolve, ms));
}
let versionShowed = 1;
let content = get("content");
let text = get("text");
let throbber = get("throbber");
let ok = get("OK");
let next = get("next");
let last = get("last");
let help = get("help");
let back = get("back")
let allVersions = ["Error"];
fetch("versions.json", {
		cache: 'no-cache'
	})
	.then(response => response.text())
	.then(data => {
		console.log("Setting allVersions")
		allVersions = JSON.parse(data)
	})
	.catch(error => allVersions = ["Error, nie można wziąść wersji"]);

function hidetext() {
    content.style.display = "none";
	window.parent.postMessage("OK", '*');
}
function help_me() {
  next.style.display = "none";
  last.style.display = "none";
  help.style.display = "none";
  text.innerHTML = "1 liczba - ilość dużych zmian, 2 liczba - ilość małych zmian, 3 liczba - ilość malutkich zmian";
  back.style.display = "inline";
}
function go_back() {
  throbber.style.display = "none";
  back.style.display = "none";
  ok.style.display = "inline";
  text.style.display = "inline";
  next.style.display = "inline";
  last.style.display = "inline";
  help.style.display = "inline";
  updatetext();
}
async function nextversion() {
  versionShowed -= 1;
  if (allVersions[allVersions.length - versionShowed]) {
    updatetext();
  } else {
    versionShowed += 1;
    next.innerHTML = "Nie ma"
    await sleep(800);
    next.innerHTML = "Następna wersja"
  }
}
async function lastversion() {
  versionShowed += 1;
  if (allVersions[allVersions.length - versionShowed]) {
    updatetext();
  } else {
    versionShowed -= 1;
    last.innerHTML = "Nie ma";
    await sleep(800);
    last.innerHTML = "Ostatnia wersja"
  }
}
function updatetext() {
  let version = allVersions[allVersions.length - versionShowed].split("-");
  let versionArray = version[0].split(".");
  text.innerHTML = allVersions[allVersions.length - versionShowed];
}
async function restOfTheScript() {
	await sleep(500);
	throbber.style.display = "none";
    ok.style.display = "inline";
    text.style.display = "inline";
    next.style.display = "inline";
    last.style.display = "inline";
    help.style.display = "inline";
    updatetext();
}
restOfTheScript();
    </script>
        </body>
        </html>
