<!DOCTYPE html>
<html>
  <head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Witaj w mojej ultra sigma stronie">
    <title>maciej hub</title>
  <link rel="icon" type="image/x-icon" href="/ikon.png">
    <link href="/style2.css" rel="stylesheet" type="text/css" media="all">
    <style>
        body {
            background-color: transparent;
        }
    </style>
  </head>
<body>
    <div id="content" class="center">
        <img id="throbber" src="loading.png" width="64">
        <h2><div style="display: none;" id="text">Hello</div></h2>
        <button id="OK" style="display: none;" class="centerpopupbutton" onclick="hidetext()">Zamknij</button>
        <button id="last" style="display: none;" class="centerpopupbutton" onclick="lastversion()">Ostatnia wersja</button>
        <button id="next" style="display: none;" class="centerpopupbutton" onclick="nextversion()">Następna wersja</button>
    </div>
    <script>
function sleep(ms) {
	return new Promise(resolve => setTimeout(resolve, ms));
}
let versionShowed = 1;
let content = document.getElementById("content");
let text = document.getElementById("text");
let throbber = document.getElementById("throbber");
let ok = document.getElementById("OK");
let next = document.getElementById("next");
let last = document.getElementById("last");
let allVersions = ["Error"];
fetch("versions.json", {
		cache: 'no-cache'
	})
	.then(response => response.text())
	.then(data => {
		console.log("Setting allVersions")
		allVersions = JSON.parse(data)
	})
	.catch(error => allVersions = ["Error, nie można wziąść wersji"]);

function hidetext() {
    content.style.display = "none";
	window.parent.postMessage("OK", '*');
}
async function nextversion() {
  versionShowed -= 1;
  if (allVersions[allVersions.length - versionShowed]) {
    updatetext();
  } else {
    versionShowed += 1;
    next.innerHTML = "Nie ma"
    await sleep(800);
    next.innerHTML = "Następna wersja"
  }
}
async function lastversion() {
  versionShowed += 1;
  if (allVersions[allVersions.length - versionShowed]) {
    updatetext();
  } else {
    versionShowed -= 1;
    last.innerHTML = "Nie ma";
    await sleep(800);
    last.innerHTML = "Ostatnia wersja"
  }
}
function updatetext() {
  let version = allVersions[allVersions.length - versionShowed].split("-");
  let versionArray = version[0].split(".");
  text.innerHTML = allVersions[allVersions.length - versionShowed] + ", czyli " + versionArray[0] + " duża zmiana, " + versionArray[1] + " mała zmiana, i " + versionArray[2] + "malutka zmiana.";
}
async function restOfTheScript() {
	await sleep(500);
	throbber.style.display = "none";
    ok.style.display = "inline";
    text.style.display = "inline";
    next.style.display = "inline";
    last.style.display = "inline";
    updatetext();
}
restOfTheScript();
    </script>
        </body>
        </html>
