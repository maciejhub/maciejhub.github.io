<!DOCTYPE html>
<html>
  <head>
     <meta charset="UTF-8">
     <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Witaj w mojej ultra sigma stronie">
    <title>maciej hub</title>
  <link rel="icon" type="image/x-icon" href="/ikon.png">
    <link href="/style2.css" rel="stylesheet" type="text/css" media="all">
    <style>
        body {
            background-color: transparent;
        }
    </style>
  </head>
<body>
    <div id="content" class="center">
        <img id="throbber" src="loading.png" width="64">
        <h2><img src="" id="image" width="160"></h2>
        <button id="OK" style="display: none;" class="centerpopupbutton" onclick="hidetext()">Zamknij</button>
        <button id="next" style="display: none;" class="centerpopupbutton" onclick="nextcode()">Następny kod</button>
        <button id="download" style="display: none;" class="centerpopupbutton" onclick="downloadcode('singular')">Pobierz jeden kod</button>
        <button id="downloadpage" style="display: none;" class="centerpopupbutton" onclick="downloadcode('pages')">Pobierz całą stronę A4 tego kodu</button>
    </div>
    <script>
function sleep(ms) {
	return new Promise(resolve => setTimeout(resolve, ms));
}
let code = -1;
let content = document.getElementById("content");
let image = document.getElementById("image");
let throbber = document.getElementById("throbber");
let ok = document.getElementById("OK");
let next = document.getElementById("next");
let download = document.getElementById("download");
let downloadpage = document.getElementById("downloadpage");
let allCodeData = ["Error, nie można wziąść kodów"];
fetch("codeData.json", {
		cache: 'no-cache'
	})
	.then(response => response.text())
	.then(data => {
		console.log("Setting codeData")
		allCodeData = JSON.parse(data)
	})
	.catch(error => allCodeData = ["Error, nie można wziąść kodów"]);

function hidetext() {
    content.style.display = "none";
	window.parent.postMessage("OK", '*');
}
async function nextcode() {
  code += 1;
  if (code > allCodeData.length - 1) {
    code = 0;
  }
  const codeData = allCodeData[code].split("-");
  image.src = "codes/singular/" + codeData[1];
  if (codeData[1] == "card.png") {
    image.width = 280;
  } else {
    image.width = 160;
  }
}
function downloadcode(amount) {
  const link = document.createElement("a");
  const codeData = allCodeData[code].split("-")
  link.download = codeData[0] + " z maciej hub";
  link.href = "codes/" + amount + "/" + codeData[1];
  link.click();
  link.remove();
  console.log("Downloading " + amount + " of " + codeData[1]);
}
async function restOfTheScript() {
	await sleep(500);
	nextcode();
	throbber.style.display = "none";
    ok.style.display = "inline";
    image.style.display = "inline";
    next.style.display = "inline";
    download.style.display = "inline";
    downloadpage.style.display = "inline";
}
restOfTheScript();
    </script>
        </body>
        </html>
