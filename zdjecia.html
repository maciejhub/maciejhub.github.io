<script>
function showimage(file) {
  document.getElementById("downloadbutton").innerHTML = "<button class='centerpopupbutton' onclick='download(\"" + file + "\")'>Pobierz</button>";
  document.getElementById("imagepopup").style.display = "inline";
  document.getElementById("popupimage").src = file;
}
document.addEventListener("onload", function() {
  document.getElementById("imagepopup").style.width = document.getElementById("popupimage").clientWidth + "px";
});
function hidepopup() {
  document.getElementById("imagepopup").style.display = "none";
}
function download(file) {
  const link = document.createElement("a");
  link.download = "maciej hub " + file.split("/")[1];
  link.href = file;
  link.click();
  link.remove();
}
</script>
