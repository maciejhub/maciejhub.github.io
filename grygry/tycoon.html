<!DOCTYPE html>
<html>
  <head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Witaj w mojej ultra sigma stronie">
    <title>maciej hub</title>
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
  </head>
<body>
<div class="center">
<h4 style="margin-bottom: 15px;" id="playcounter">Tutaj powinno być ile w to grałeś</h4>
<div style="margin-top: -30px;"></div>
<br>
<button onclick="redirect()" class="button">
<img src="https://uploads.scratch.mit.edu/get_image/project/1235473043_480x360.png" width=240>
<h2>zepsuc nokie TYCOON</h2>
<h3>kliknij ten napis aby zacząć ładować zepsuc nokie TYCOON</h3>
</button>
</div>
<div style="margin-top: 20px;"></div>
<script>
let thing = "https://turbowarp.org/1235473043/embed?addons=pause";
let played1 = JSON.parse(localStorage.gamesPlayed);
document.getElementById("playcounter").innerText = "Grałeś w zepsuć nokie TYCOON " + played1[6] + " razy!"
function redirect() {
  let played = JSON.parse(localStorage.gamesPlayed);
  played[6] = parseInt(played[6]) + 1;
  localStorage.setItem("gamesPlayed", JSON.stringify(played))
  window.location.href = thing;
}
if (localStorage.quest == "nZNT") {
  thing = "https://turbowarp.org/1235473043/embed?addons=pause&size=482x362"
}
const array = [document.body.scrollHeight, "nokiatycoon"];
window.parent.postMessage(array);
</script>
