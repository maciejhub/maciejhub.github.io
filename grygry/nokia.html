<!DOCTYPE html>
<html>
  <head>
     <meta charset="UTF-8">
     <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Witaj w mojej ultra sigma stronie">
    <title>maciej hub</title>
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
  </head>
<body>
<div class="center">
    <h4 style="margin-bottom: 15px;" id="playcounter">Tutaj powinno być ile w to grałeś</h4>
    <div style="margin-top: -30px;"></div>
<br>
<button onclick="redirect('1')" class="button">
<img src="https://uploads.scratch.mit.edu/get_image/project/1235410477_480x360.png" width=240>
<h2>zepsuć nokie SIMULATOR</h2>
<h3>kliknij ten napis aby zacząć ładować zepsuć nokie SIMULATOR</h3>
</button>
<div style="margin-top: -25px;"></div>
<button onclick="redirect('2')" class="button">
<h3 style="font-size: 95%;">albo kliknij ten napis aby zacząć ładować wersje z większym ekranem</h3>
</button>
</div>
<div style="margin-top: 20px;"></div>
<script>
let link = "https://turbowarp.org/1235410477/embed?addons=pause";
let last_width_digit = 0;
let last_height_digit = 0;
let played1 = JSON.parse(localStorage.gamesPlayed);
if (played1[2] == 1) {
  document.getElementById("playcounter").innerText = "Grałeś w zepsuć nokie SIMULATOR " + played1[2] + " raz!";
} else {
  document.getElementById("playcounter").innerText = "Grałeś w zepsuć nokie SIMULATOR " + played1[2] + " razy!";
}
function redirect(which) {
  let played = JSON.parse(localStorage.gamesPlayed);
  played[2] = parseInt(played[2]) + 1;
  localStorage.setItem("gamesPlayed", JSON.stringify(played));
  if (which == "1") {
    window.location.href = `${link}&size=48${last_width_digit}x36${last_height_digit}`
  } else if (which == "2") {
    window.location.href = `${link}&size=64${last_width_digit}x36${last_height_digit}`
  }
}
if (JSON.parse(localStorage.boughtItems).includes("gold")) {
  last_height_digit = 2;
}
if (localStorage.quest == "nZNS") {
  last_width_digit = 2;
}
</script>
