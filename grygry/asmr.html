<!DOCTYPE html>
<html>
  <head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Witaj w mojej ultra sigma stronie">
    <title>maciej hub</title>
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
  </head>
<body>
<div class="center">
    <h4 style="margin-bottom: 15px;" id="playcounter">Tutaj powinno być ile w to grałeś</h4>
    <div style="margin-top: -30px;"></div>
<br>
<button onclick="redirect()" class="button">
<img src="https://uploads.scratch.mit.edu/get_image/project/1235469979_480x360.png" width=240>
<h2>asmr bułka: the gra</h2>
<h3>kliknij ten napis aby zacząć ładować asmr bułka: the gra</h3>
</button>
</div>
<div style="margin-top: 20px;"></div>
<script>
let thing = "https://turbowarp.org/1235469979/embed?addons=pause";
let played1 = JSON.parse(localStorage.gamesPlayed);
if (played1[4] == 1) {
  document.getElementById("playcounter").innerHTML = "Grałeś w asmr bułka: the gra " + played1[4] + " raz!";
} else {
  document.getElementById("playcounter").innerHTML = "Grałeś w asmr bułka: the gra " + played1[4] + " razy!";
}
function redirect() {
  let played = JSON.parse(localStorage.gamesPlayed);
  played[4] = parseInt(played[4]) + 1;
  localStorage.setItem("gamesPlayed", JSON.stringify(played))
  window.location.href = thing;
}
if (localStorage.quest == "nAS") {
  thing = "https://turbowarp.org/1235469979/embed?addons=pause&size=482x362"
}
</script>
